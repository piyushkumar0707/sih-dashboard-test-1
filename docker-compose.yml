name: travira

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  safety-score:
    build:
      context: .
      dockerfile: AI_services/safety_score/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  case-report:
    build:
      context: .
      dockerfile: AI_services/case_report/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MONGODB_URI: mongodb://mongo:27017/travira
      FRONTEND_URL: http://localhost:3000
      AI_SAFETY_SCORE_URL: http://safety-score:8001
      AI_CASE_REPORT_URL: http://case-report:8002
      BLOCKCHAIN_API_URL: http://localhost:4000
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      safety-score:
        condition: service_started
      case-report:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  mongo_data:
